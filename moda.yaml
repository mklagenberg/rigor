moda:
  manifest_version: "1.0"
  repository: "https://github.com/mklagenberg/moda"
  compatibility: "^1.0.0"
  verified_against: "1.0.0"
  verified_commit: "81171ed22163f73f250e32534f9edc3a4f8d51e1"

artifact:
  id: "rigor"
  name: "RIGOR — Research, Investigation, Grounding, Orchestration & Revalidation"
  kind: "methodology"
  domain: "evidence-grounded investigation and research"
  version: "0.2.0"
  status: "development"
  language: "en"
  repository: "https://github.com/mklagenberg/rigor"
  license: "Apache-2.0"

adoption:
  relationship: "conforms_to"
  mode: "native"
  claim_stage: "mapped"
  conformance_result: "partial"

documentation:
  human_entrypoint: "README.md"
  agent_entrypoint: "AGENTS.md"
  claude_entrypoint: "CLAUDE.md"
  specification: "SPEC.md"
  getting_started: "GETTING-STARTED.md"
  invariants: "CONSTITUTION.md"
  best_practices: "BEST-PRACTICES.md"
  limitations: "DISCLAIMER.md"
  changelog: "CHANGELOG.md"
  roadmap: "ROADMAP.md"
  upgrade: "UPGRADE.md"
  migrations: "MIGRATIONS.md"
  decisions: "decisions/"
  decision_policy: "docs/decision-records.md"
  change_management: "docs/change-management.md"
  validation: "docs/validation-and-repair.md"
  git_workflow: "docs/git-and-release-workflow.md"

components:
  - id: "activation-model"
    kind: "framework"
    source: "docs/activation-and-proportionality.md"
    lifecycle: "embedded"
  - id: "evidence-model"
    kind: "model"
    source: "docs/evidence-model.md"
    lifecycle: "embedded"
  - id: "rigor-process"
    kind: "process"
    source: "docs/research-process.md"
    lifecycle: "embedded"
  - id: "dossier-contract"
    kind: "protocol"
    source: "docs/dossier-and-derivations.md"
    lifecycle: "embedded"
  - id: "agent-orchestration"
    kind: "framework"
    source: "docs/agent-architecture.md"
    lifecycle: "embedded"
  - id: "hypothesis-and-research-loop"
    kind: "process"
    source: "docs/hypotheses-and-research-loops.md"
    lifecycle: "embedded"

packages:
  specification:
    role: "normative-specification"
    version: "0.2.0"
    source: "SPEC.md"
    source_kind: "local"
  rigor-core:
    role: "portable-embedded-protocol"
    version: "0.2.0"
    source: "skills/rigor-core"
    source_kind: "local"
  rigor-skill:
    role: "installable-orchestration-skill"
    version: "0.2.0"
    source: "skills/rigor"
    source_kind: "local"

installations:
  - package: "rigor-skill"
    environment: "chatgpt-work-personal-skills"
    version: "0.2.0"
    state: "current"
    source: "skills/rigor"
    update_policy: "explicit-only"

conformance:
  profile: "conformance/moda.yaml"
  latest_audit: "audits/moda/2026-08-14-hypothesis-loop.yaml"
  audit_mode: "self-audit"

synchronization:
  policy: "docs/synchronization.md"
  state: "current"
  reason: "MODA v1.0.0 remains the latest release; its immutable commit 81171ed22163f73f250e32534f9edc3a4f8d51e1 and security advisory state were checked on 2026-08-14."
